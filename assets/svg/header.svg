<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Oscar Dev</title>
  <desc id="desc">Código, comunidad y curiosidad desde Costa Rica. Una terminal con una órbita animada.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#090e1a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26334a" stroke-opacity=".35"/></pattern>
  </defs>
  <style>
    .orbit{transform-origin:780px 158px;animation:orbit 24s linear infinite}.cursor{animation:blink 1.6s steps(2,end) infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.orbit,.cursor{animation:none}}
  </style>
  <rect width="960" height="330" rx="20" fill="url(#bg)"/>
  <rect width="960" height="330" rx="20" fill="url(#grid)"/>
  <path d="M24 1H936" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="ui-monospace,Consolas,monospace">
    <circle cx="40" cy="32" r="5" fill="#fb7185"/><circle cx="58" cy="32" r="5" fill="#fbbf24"/><circle cx="76" cy="32" r="5" fill="#5eead4"/>
    <text x="108" y="37" fill="#94a3b8" font-size="12">oscar@costa-rica ~ / ideas</text>
    <text x="48" y="103" fill="#5eead4" font-size="14" letter-spacing="3">DESARROLLADOR · COSTA RICA</text>
    <text x="44" y="177" fill="#f1f5f9" font-size="66" font-weight="700" letter-spacing="-3">Oscar Dev<tspan fill="#5eead4">.</tspan></text>
    <text x="48" y="217" fill="#b5c3d7" font-size="17">Código, comunidad y curiosidad.</text>
    <text x="48" y="283" fill="#5eead4" font-size="14">❯</text><text x="70" y="283" fill="#cbd5e1" font-size="14">construyendo ideas con código</text>
    <rect class="cursor" x="326" y="270" width="8" height="16" fill="#5eead4"/>
  </g>
  <circle cx="780" cy="158" r="103" fill="none" stroke="#26364e"/>
  <circle cx="780" cy="158" r="76" fill="#101b30" stroke="#38506b" stroke-dasharray="3 8"/>
  <g class="orbit"><ellipse cx="780" cy="158" rx="122" ry="46" fill="none" stroke="#5eead4" stroke-opacity=".6" transform="rotate(-35 780 158)"/><circle cx="880" cy="99" r="6" fill="#5eead4"/><circle cx="677" cy="214" r="4" fill="#a78bfa"/></g>
  <text x="780" y="177" text-anchor="middle" font-family="Consolas,monospace" font-size="52" fill="#e2e8f0">&lt;/&gt;</text>
  <text x="780" y="299" text-anchor="middle" font-family="Consolas,monospace" font-size="11" letter-spacing="4" fill="#94a3b8">PURA VIDA</text>
</svg>
