<text x="64" y="48" font-size="13" fill="#a9bed8" class="mono">Oscar-Dev0 / software developer</text><text x="40" y="107" font-size="17" fill="#83bbef" >Desde Costa Rica, para tus ideas.</text><text x="36" y="190" font-size="78" fill="#f4f9ff" font-weight="750" letter-spacing="-4">Oscar Dev.</text><text x="40" y="239" font-size="29" fill="#deebff" font-weight="500">Del código al servidor.</text><text x="40" y="271" font-size="17" fill="#a9bed8" >Web, bots, herramientas e infraestructura.</text>
