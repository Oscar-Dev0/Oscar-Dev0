fill="#d5e7fa" font-weight="600" text-anchor="middle">Docker</text><rect x="26" y="298" width="208" height="102" rx="12" fill="#09182a" stroke="#223f60"/><g transform="translate(130 333) scale(0.65)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m-25-21 21-3V-2h-21Zm25-4 25-4V-2H0ZM-25 2h21v22l-21-3ZM0 2h25v27L0 25Z"/></g><text x="130" y="380" font-size="21" fill="#d5e7fa" font-weight="600" text-anchor="middle">Windows Server</text><rect x="246" y="298" width="208" height="102" rx="12" fill="#09182a" stroke="#223f60"/><g transform="translate(350 333) scale(0.65)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-27" y="-21" width="54" height="42" rx="6"/><path d="m-15-6 9 8-9 8M1 11h14M-27-11h54"/></g><text x="350" y="380" font-size="21" fill="#d5e7fa" font-weight="600" text-anchor="middle">Node.js</text><rect x="26" y="414" width="208" height="102" rx="12" fill="#09182a" stroke="#223f60"/><g transform="translate(130 449) scale(0.65)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5-29-22 5H-3l-5 24L23-7H3Z"/></g><text x="130" y="496" font-size="21" fill="#d5e7fa" font-weight="600" text-anchor="middle">Bun</text><rect x="246" y="414" width="208" height="102" rx="12" fill="#09182a" stroke="#223f60"/><g transform="translate(350 449) scale(0.65)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-19" rx="25" ry="9"/><path d="M-25-19v38c0 12 50 12 50 0v-38M-25-1c0 12 50 12 50 0M-25 10c0 12 50 12 50 0"/></g><text x="350" y="496" font-size="21" fill="#d5e7fa" font-weight="600" text-anchor="middle">MySQL</text>
