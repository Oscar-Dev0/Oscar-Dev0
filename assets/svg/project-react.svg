<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240" role="img" aria-labelledby="title desc">
<title id="title">Todo</title>
<desc id="desc">Todo. Proyecto de práctica con React, rutas y estilos por componentes. React · Router · styled-components. Abrir repositorio.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081629"/><stop offset=".55" stop-color="#040a14"/><stop offset="1" stop-color="#020409"/></linearGradient>
<linearGradient id="blue" x2="1" y2=".5"><stop stop-color="#a6dcff"/><stop offset=".45" stop-color="#38a3ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#2563eb" stop-opacity=".32"/><stop offset=".5" stop-color="#1061d6" stop-opacity=".12"/><stop offset="1" stop-color="#1061d6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#588ac3" stroke-opacity=".075"/></pattern>
</defs>
<style>text{font-family:Segoe UI,Inter,Arial,sans-serif}.mono{font-family:Cascadia Code,Consolas,monospace}
.orbit{animation:orbit 32s linear infinite;transform-origin:760px 205px}
.counter{animation:orbit 48s linear infinite reverse;transform-origin:760px 205px}
.signal{stroke-dasharray:8 140;animation:signal 7s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite alternate}
.cursor{animation:blink 1.4s steps(2,end) infinite}
.float{animation:float 8s ease-in-out infinite alternate}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes signal{to{stroke-dashoffset:-296}}
@keyframes breathe{to{opacity:.45}}
@keyframes blink{50%{opacity:0}}
@keyframes float{to{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.avatar-decoration{display:none}}
</style>
<rect x="1" y="1" width="458" height="238" rx="16" fill="url(#bg)" stroke="#1c3553"/><ellipse cx="410" cy="60" rx="140" ry="120" fill="url(#halo)"/><g transform="translate(406 53) scale(0.58)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle r="5" fill="#82c6ff"/><ellipse rx="31" ry="11"/><ellipse rx="31" ry="11" transform="rotate(60)"/><ellipse rx="31" ry="11" transform="rotate(120)"/></g><text x="24" y="39" font-size="13" fill="#8fbce7" >Web / React</text><text x="23" y="88" font-size="27" fill="#edf6ff" font-weight="700" letter-spacing="-.6">Todo</text><text x="24" y="126" font-size="16" fill="#a9bed8" >Proyecto de práctica con React,</text><text x="24" y="151" font-size="16" fill="#a9bed8" >rutas y estilos por componentes.</text><path d="M24 174H436" stroke="#203d5e"/><path class="signal" d="M24 174H436" stroke="#63b8ff" stroke-width="1.5"/><text x="24" y="212" font-size="13" fill="#acd4ff" class="mono">React · Router · styled-components</text><text x="431" y="213" font-size="21" fill="#91caff" text-anchor="end">↗</text>
</svg>
