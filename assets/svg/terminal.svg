<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">Mi stack desde la terminal</title>
<desc id="desc">Terminal Linux ilustrada con mis tecnologías: SvelteKit, React, Node.js, Bun, Docker, Compose, Linux, Windows Server, Discord y FiveM. No ejecuta comandos.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081629"/><stop offset=".55" stop-color="#040a14"/><stop offset="1" stop-color="#020409"/></linearGradient>
<linearGradient id="blue" x2="1" y2=".5"><stop stop-color="#a6dcff"/><stop offset=".45" stop-color="#38a3ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#2563eb" stop-opacity=".32"/><stop offset=".5" stop-color="#1061d6" stop-opacity=".12"/><stop offset="1" stop-color="#1061d6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#588ac3" stroke-opacity=".075"/></pattern>
</defs>
<style>text{font-family:Segoe UI,Inter,Arial,sans-serif}.mono{font-family:Cascadia Code,Consolas,monospace}
.orbit{animation:orbit 32s linear infinite;transform-origin:760px 205px}
.counter{animation:orbit 48s linear infinite reverse;transform-origin:760px 205px}
.signal{stroke-dasharray:8 140;animation:signal 7s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite alternate}
.cursor{animation:blink 1.4s steps(2,end) infinite}
.float{animation:float 8s ease-in-out infinite alternate}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes signal{to{stroke-dashoffset:-296}}
@keyframes breathe{to{opacity:.45}}
@keyframes blink{50%{opacity:0}}
@keyframes float{to{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.avatar-decoration{display:none}}
.terminal-scan{animation:scan 16s ease-in-out infinite alternate}@keyframes scan{to{transform:translateY(270px)}}</style>
<rect x="1" y="1" width="958" height="388" rx="20" fill="url(#bg)" stroke="#1c3553"/><path d="M1 45H959M607 45V389" stroke="#1c3553"/><g fill="#416da0"><circle cx="25" cy="24" r="4"/><circle cx="41" cy="24" r="4"/><circle cx="57" cy="24" r="4"/></g><text x="80" y="29" font-size="13" fill="#a5c8e9" class="mono">oscar@linux: ~/workspace</text><text x="933" y="29" font-size="12" fill="#8eb6df" class="mono" text-anchor="end">bash / stack.yml</text><rect x="2" y="46" width="603" height="342" fill="url(#grid)"/><rect x="2" y="46" width="39" height="342" fill="#050c18" fill-opacity=".5"/><path class="terminal-scan" d="M44 65H580" stroke="#4aaeff" stroke-opacity=".07" stroke-width="8"/><text x="26" y="85" font-size="18" fill="#9fd4ff" class="mono">$ cat stack.yml</text><text x="28" y="126" font-size="11" fill="#567699" class="mono" text-anchor="end">1</text><text x="50" y="126" font-size="17" fill="#90b2d6" class="mono">developer:</text><text x="190" y="126" font-size="17" fill="#d4e8ff" class="mono">Oscar Dev</text><text x="28" y="160" font-size="11" fill="#567699" class="mono" text-anchor="end">2</text><text x="50" y="160" font-size="17" fill="#90b2d6" class="mono">web:</text><text x="190" y="160" font-size="17" fill="#d4e8ff" class="mono">[SvelteKit, React]</text><text x="28" y="194" font-size="11" fill="#567699" class="mono" text-anchor="end">3</text><text x="50" y="194" font-size="17" fill="#90b2d6" class="mono">runtime:</text><text x="190" y="194" font-size="17" fill="#d4e8ff" class="mono">[Node.js, Bun]</text><text x="28" y="228" font-size="11" fill="#567699" class="mono" text-anchor="end">4</text><text x="50" y="228" font-size="17" fill="#90b2d6" class="mono">containers:</text><text x="190" y="228" font-size="17" fill="#d4e8ff" class="mono">[Docker, Compose]</text><text x="28" y="262" font-size="11" fill="#567699" class="mono" text-anchor="end">5</text><text x="50" y="262" font-size="17" fill="#90b2d6" class="mono">systems:</text><text x="190" y="262" font-size="17" fill="#d4e8ff" class="mono">[Linux, Windows Server]</text><text x="28" y="296" font-size="11" fill="#567699" class="mono" text-anchor="end">6</text><text x="50" y="296" font-size="17" fill="#90b2d6" class="mono">community:</text><text x="190" y="296" font-size="17" fill="#d4e8ff" class="mono">[Discord, FiveM]</text><text x="26" y="355" font-size="18" fill="#9fd4ff" class="mono">$</text><rect class="cursor" x="47" y="339" width="10" height="21" fill="#38a3ff"/><g transform="translate(902 101) scale(0.66)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-27" y="-22" width="54" height="44" rx="5"/><path d="M-27-10h54m-13 8 8 7-8 7m-28-14-8 7 8 7m13-17-6 20"/></g><text x="638" y="91" font-size="23" fill="#e4f2ff" font-weight="650">Interfaces</text><text x="638" y="122" font-size="16" fill="#a9bed8" >SvelteKit / React</text><path d="M638 143H930" stroke="#1c3553"/><g transform="translate(902 202) scale(0.66)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-29 4h49c10 0 13-8 13-8l-9-2-3-8-6 9M-28 4c1 19 36 24 49 0"/><path d="M-24-7h9V3h-9ZM-13-7h9V3h-9ZM-2-7h9V3h-9ZM9-7h9V3H9ZM-13-19h9v10h-9ZM-2-19h9v10h-9Z"/></g><text x="638" y="192" font-size="23" fill="#e4f2ff" font-weight="650">Contenedores</text><text x="638" y="223" font-size="16" fill="#a9bed8" >Docker / Compose</text><path d="M638 244H930" stroke="#1c3553"/><g transform="translate(902 303) scale(0.66)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m-25-21 21-3V-2h-21Zm25-4 25-4V-2H0ZM-25 2h21v22l-21-3ZM0 2h25v27L0 25Z"/></g><text x="638" y="293" font-size="23" fill="#e4f2ff" font-weight="650">Sistemas</text><text x="638" y="324" font-size="16" fill="#a9bed8" >Linux / Windows Server</text><path d="M638 345H930" stroke="#1c3553"/>
</svg>
