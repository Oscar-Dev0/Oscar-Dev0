<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180" role="img" aria-labelledby="title desc">
<title id="title">Costa Rica · Pura vida</title>
<desc id="desc">Bandera de Costa Rica con cinco franjas en proporción 1:1:2:1:1 y reflejo suave.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081629"/><stop offset=".55" stop-color="#040a14"/><stop offset="1" stop-color="#020409"/></linearGradient>
<linearGradient id="blue" x2="1" y2=".5"><stop stop-color="#a6dcff"/><stop offset=".45" stop-color="#38a3ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#2563eb" stop-opacity=".32"/><stop offset=".5" stop-color="#1061d6" stop-opacity=".12"/><stop offset="1" stop-color="#1061d6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#588ac3" stroke-opacity=".075"/></pattern>
<clipPath id="flag"><rect x="26" y="40" width="150" height="100" rx="9"/></clipPath><linearGradient id="silk"><stop stop-color="#fff" stop-opacity=".03"/><stop offset=".4" stop-color="#fff" stop-opacity=".17"/><stop offset=".8" stop-color="#000" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity=".06"/></linearGradient><linearGradient id="sheen"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<style>text{font-family:Segoe UI,Inter,Arial,sans-serif}.mono{font-family:Cascadia Code,Consolas,monospace}
.orbit{animation:orbit 32s linear infinite;transform-origin:760px 205px}
.counter{animation:orbit 48s linear infinite reverse;transform-origin:760px 205px}
.signal{stroke-dasharray:8 140;animation:signal 7s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite alternate}
.cursor{animation:blink 1.4s steps(2,end) infinite}
.float{animation:float 8s ease-in-out infinite alternate}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes signal{to{stroke-dashoffset:-296}}
@keyframes breathe{to{opacity:.45}}
@keyframes blink{50%{opacity:0}}
@keyframes float{to{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.avatar-decoration{display:none}}
.silk{animation:silk 9s ease-in-out infinite}@keyframes silk{to{transform:translateX(330px)}}</style>
<rect x="1" y="1" width="478" height="178" rx="20" fill="url(#bg)" stroke="#1c3553"/><ellipse cx="410" cy="80" rx="190" ry="130" fill="url(#halo)"/><g clip-path="url(#flag)"><path d="M26 40h150v100H26Z" fill="#002b7f"/><path d="M26 56.6667h150v66.6666H26Z" fill="#fff"/><path d="M26 73.3333h150v33.3334H26Z" fill="#ce1126"/><rect x="26" y="40" width="150" height="100" fill="url(#silk)"/><rect class="silk" x="-125" y="40" width="140" height="100" fill="url(#sheen)"/></g><rect x="26" y="40" width="150" height="100" rx="9" fill="none" stroke="#91b5dd" stroke-opacity=".2"/><text x="202" y="51" font-size="13" fill="#97bde5" >Mi rincón del mundo</text><text x="200" y="88" font-size="32" fill="#eef7ff" font-weight="700" letter-spacing="-1">Costa Rica</text><text x="202" y="117" font-size="17" fill="#a9bed8" >Pura vida, puro código.</text><text x="202" y="147" font-size="12" fill="#9cc9f1" class="mono">Centroamérica / UTC−6</text>
</svg>
