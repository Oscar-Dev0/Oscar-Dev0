 stroke="#223f60"/><g transform="translate(765 112) scale(0.62)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-29 4h49c10 0 13-8 13-8l-9-2-3-8-6 9M-28 4c1 19 36 24 49 0"/><path d="M-24-7h9V3h-9ZM-13-7h9V3h-9ZM-2-7h9V3h-9ZM9-7h9V3H9ZM-13-19h9v10h-9ZM-2-19h9v10h-9Z"/></g><text x="797" y="119" font-size="19" fill="#d5e7fa" font-weight="600">Docker</text><rect x="28" y="176" width="202" height="100" rx="12" fill="#09182a" stroke="#223f60"/><g transform="translate(63 224) scale(0.62)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m-25-21 21-3V-2h-21Zm25-4 25-4V-2H0ZM-25 2h21v22l-21-3ZM0 2h25v27L0 25Z"/></g><text x="95" y="231" font-size="17" fill="#d5e7fa" font-weight="600">Windows Server</text><rect x="262" y="176" width="202" height="100" rx="12" fill="#09182a" stroke="#223f60"/><g transform="translate(297 224) scale(0.62)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m0-30 26 15v30L0 30-26 15v-30Z"/><path d="M-9 13v-26L9 13v-26" stroke-width="3" fill="none"/></g><text x="329" y="231" font-size="19" fill="#d5e7fa" font-weight="600">Node.js</text><rect x="496" y="176" width="202" height="100" rx="12" fill="#09182a" stroke="#223f60"/><g transform="translate(531 224) scale(0.62)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5-29-22 5H-3l-5 24L23-7H3Z"/></g><text x="563" y="231" font-size="19" fill="#d5e7fa" font-weight="600">Bun</text><rect x="730" y="176" width="202" height="100" rx="12" fill="#09182a" stroke="#223f60"/><g transform="translate(765 224) scale(0.62)" fill="#091a30" stroke="#82c6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-19" rx="25" ry="9"/><path d="M-25-19v38c0 12 50 12 50 0v-38M-25-1c0 12 50 12 50 0M-25 10c0 12 50 12 50 0"/></g><text x="797" y="231" font-size="19" fill="#d5e7fa" f