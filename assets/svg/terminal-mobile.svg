<svg xmlns="http://www.w3.org/2000/svg" width="480" height="446" viewBox="0 0 480 446" role="img" aria-labelledby="title desc">
<title id="title">Mi stack desde la terminal</title>
<desc id="desc">Terminal ilustrada. React, SvelteKit, Node.js, Bun, Docker, Compose, Linux, Windows Server, Discord y FiveM.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081629"/><stop offset=".55" stop-color="#040a14"/><stop offset="1" stop-color="#020409"/></linearGradient>
<linearGradient id="blue" x2="1" y2=".5"><stop stop-color="#a6dcff"/><stop offset=".45" stop-color="#38a3ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#2563eb" stop-opacity=".32"/><stop offset=".5" stop-color="#1061d6" stop-opacity=".12"/><stop offset="1" stop-color="#1061d6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#588ac3" stroke-opacity=".075"/></pattern>
</defs>
<style>text{font-family:Segoe UI,Inter,Arial,sans-serif}.mono{font-family:Cascadia Code,Consolas,monospace}
.orbit{animation:orbit 32s linear infinite;transform-origin:760px 205px}
.counter{animation:orbit 48s linear infinite reverse;transform-origin:760px 205px}
.signal{stroke-dasharray:8 140;animation:signal 7s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite alternate}
.cursor{animation:blink 1.4s steps(2,end) infinite}
.float{animation:float 8s ease-in-out infinite alternate}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes signal{to{stroke-dashoffset:-296}}
@keyframes breathe{to{opacity:.45}}
@keyframes blink{50%{opacity:0}}
@keyframes float{to{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.avatar-decoration{display:none}}
</style>
<rect x="1" y="1" width="478" height="444" rx="20" fill="url(#bg)" stroke="#1c3553"/><path d="M1 47H479" stroke="#1c3553"/><text x="26" y="31" font-size="16" fill="#a5c8e9" class="mono">oscar@linux: ~/workspace</text><rect x="2" y="48" width="476" height="396" fill="url(#grid)"/><text x="26" y="89" font-size="23" fill="#9fd4ff" class="mono">$ cat stack.yml</text><text x="26" y="133" font-size="18" fill="#90b2d6" class="mono">developer:</text><text x="166" y="133" font-size="18" fill="#d4e8ff" class="mono">Oscar Dev</text><text x="26" y="176" font-size="18" fill="#90b2d6" class="mono">web:</text><text x="166" y="176" font-size="18" fill="#d4e8ff" class="mono">[SvelteKit, React]</text><text x="26" y="219" font-size="18" fill="#90b2d6" class="mono">runtime:</text><text x="166" y="219" font-size="18" fill="#d4e8ff" class="mono">[Node.js, Bun]</text><text x="26" y="262" font-size="18" fill="#90b2d6" class="mono">containers:</text><text x="166" y="262" font-size="18" fill="#d4e8ff" class="mono">[Docker, Compose]</text><text x="26" y="305" font-size="18" fill="#90b2d6" class="mono">systems:</text><text x="166" y="305" font-size="18" fill="#d4e8ff" class="mono">[Linux, Windows Server]</text><text x="26" y="348" font-size="18" fill="#90b2d6" class="mono">community:</text><text x="166" y="348" font-size="18" fill="#d4e8ff" class="mono">[Discord, FiveM]</text><text x="26" y="410" font-size="23" fill="#9fd4ff" class="mono">$</text><rect class="cursor" x="53" y="390" width="10" height="25" fill="#38a3ff"/>
</svg>
