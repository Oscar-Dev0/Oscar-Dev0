<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-labelledby="title desc">
<title id="title">Mi caja de herramientas</title>
<desc id="desc">TypeScript, JavaScript, Lua, Python, Go y C#.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081629"/><stop offset=".55" stop-color="#040a14"/><stop offset="1" stop-color="#020409"/></linearGradient>
<linearGradient id="blue" x2="1" y2=".5"><stop stop-color="#a6dcff"/><stop offset=".45" stop-color="#38a3ff"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#2563eb" stop-opacity=".32"/><stop offset=".5" stop-color="#1061d6" stop-opacity=".12"/><stop offset="1" stop-color="#1061d6" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#588ac3" stroke-opacity=".075"/></pattern>
</defs>
<style>text{font-family:Segoe UI,Inter,Arial,sans-serif}.mono{font-family:Cascadia Code,Consolas,monospace}
.orbit{animation:orbit 32s linear infinite;transform-origin:760px 205px}
.counter{animation:orbit 48s linear infinite reverse;transform-origin:760px 205px}
.signal{stroke-dasharray:8 140;animation:signal 7s linear infinite}
.breathe{animation:breathe 6s ease-in-out infinite alternate}
.cursor{animation:blink 1.4s steps(2,end) infinite}
.float{animation:float 8s ease-in-out infinite alternate}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes signal{to{stroke-dashoffset:-296}}
@keyframes breathe{to{opacity:.45}}
@keyframes blink{50%{opacity:0}}
@keyframes float{to{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.avatar-decoration{display:none}}
</style>
<rect x="1" y="1" width="958" height="188" rx="20" fill="url(#bg)" stroke="#1c3553"/><text x="28" y="42" font-size="23" fill="#e8f3ff" font-weight="650">Lenguajes con los que construyo</text><rect x="28" y="66" width="130" height="96" rx="12" fill="#09182a" stroke="#223f60"/><text x="93" y="108" font-size="27" fill="#91caff" font-weight="700" text-anchor="middle" class="mono">TS</text><text x="93" y="141" font-size="15" fill="#d5e7fa" text-anchor="middle">TypeScript</text><rect x="183" y="66" width="130" height="96" rx="12" fill="#09182a" stroke="#223f60"/><text x="248" y="108" font-size="27" fill="#91caff" font-weight="700" text-anchor="middle" class="mono">JS</text><text x="248" y="141" font-size="15" fill="#d5e7fa" text-anchor="middle">JavaScript</text><rect x="338" y="66" width="130" height="96" rx="12" fill="#09182a" stroke="#223f60"/><text x="403" y="108" font-size="27" fill="#91caff" font-weight="700" text-anchor="middle" class="mono">Lua</text><text x="403" y="141" font-size="15" fill="#d5e7fa" text-anchor="middle">Lua</text><rect x="493" y="66" width="130" height="96" rx="12" fill="#09182a" stroke="#223f60"/><text x="558" y="108" font-size="27" fill="#91caff" font-weight="700" text-anchor="middle" class="mono">Py</text><text x="558" y="141" font-size="15" fill="#d5e7fa" text-anchor="middle">Python</text><rect x="648" y="66" width="130" height="96" rx="12" fill="#09182a" stroke="#223f60"/><text x="713" y="108" font-size="27" fill="#91caff" font-weight="700" text-anchor="middle" class="mono">Go</text><text x="713" y="141" font-size="15" fill="#d5e7fa" text-anchor="middle">Go</text><rect x="803" y="66" width="130" height="96" rx="12" fill="#09182a" stroke="#223f60"/><text x="868" y="108" font-size="27" fill="#91caff" font-weight="700" text-anchor="middle" class="mono">C#</text><text x="868" y="141" font-size="15" fill="#d5e7fa" text-anchor="middle">C#</text>
</svg>
